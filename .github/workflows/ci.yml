name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  python-test:
    name: Python Backend Tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Python Pytest Suite
        run: |
          python -m pytest tests/python -v

  dotnet-test:
    name: .NET 8 WPF Build & Test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python for End-to-End Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies for IPC Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Restore Solution
        run: dotnet restore Findora.sln

      - name: Build Solution (Release)
        run: dotnet build Findora.sln -c Release --no-restore

      - name: Run .NET xUnit Tests
        run: dotnet test Findora.sln -c Release --no-build --verbosity normal
